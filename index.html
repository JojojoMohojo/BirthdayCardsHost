<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>Kampai!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0d0a14;
            --amber: #f59e0b;
            --amber-glow: rgba(245, 158, 11, 0.35);
            --amber-dim: #92400e;
            --pink: #e879a0;
            --pink-glow: rgba(232, 121, 160, 0.35);
            --text: #f0e6d3;
            --text-muted: #7c6e8a;
        }

        html, body { height: 100%; }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(245, 158, 11, 0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 85%, rgba(232, 121, 160, 0.08) 0%, transparent 55%);
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 32px 20px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .home {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 360px;
        }

        .drink-icons {
            display: flex;
            gap: 18px;
            margin-bottom: 32px;
            font-size: 28px;
            filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.4));
        }

        .home-title {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            font-weight: 900;
            color: var(--amber);
            text-align: center;
            line-height: 1;
            letter-spacing: 1px;
            text-shadow: 0 0 40px rgba(245, 158, 11, 0.4);
        }

        .home-subtitle {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 12px;
            margin-bottom: 40px;
            text-align: center;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 24px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.2), transparent);
        }

        .divider-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.35);
        }

        .modes {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .mode-btn {
            width: 100%;
            padding: 16px 18px;
            border-radius: 14px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.12s, box-shadow 0.15s, filter 0.15s;
            border: 1px solid transparent;
        }

        .mode-btn:active { transform: scale(0.97); }

        .mode-btn-pub {
            background: linear-gradient(135deg, #c87d0c 0%, #f59e0b 60%, #fbbf24 100%);
            color: #1a0900;
            box-shadow: 0 4px 20px var(--amber-glow), 0 1px 0 rgba(255,255,255,0.1) inset;
        }

        .mode-btn-pub:hover {
            filter: brightness(1.08);
            box-shadow: 0 6px 28px var(--amber-glow);
        }

        .mode-btn-party {
            background: linear-gradient(135deg, #9b2355 0%, #e879a0 60%, #f0abcb 100%);
            color: #1a0010;
            box-shadow: 0 4px 20px var(--pink-glow), 0 1px 0 rgba(255,255,255,0.1) inset;
        }

        .mode-btn-party:hover {
            filter: brightness(1.08);
            box-shadow: 0 6px 28px var(--pink-glow);
        }

        .mode-icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.18);
            border-radius: 10px;
        }

        .mode-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3px;
        }

        .mode-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .mode-desc {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.6;
        }

        .footer-text {
            margin-top: 40px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="home">

        <div class="drink-icons">
            <span>🍺</span>
            <span>🥂</span>
            <span>🍹</span>
        </div>

        <div class="home-title">Kampai!</div>
        <div class="home-subtitle">Choose your game</div>

        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-dot"></div>
            <div class="divider-line"></div>
        </div>

        <div class="modes">
            <a href="modes/pub-crawl/index.html" class="mode-btn mode-btn-pub">
                <div class="mode-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 2h14l-2 18H7L5 2z"/>
                        <path d="M5 8h14"/>
                        <path d="M8 2l1 6M16 2l-1 6"/>
                    </svg>
                </div>
                <div class="mode-info">
                    <span class="mode-title">Pub Crawl Mode</span>
                    <span class="mode-desc">Draw cards, assign forfeits, track the crawl</span>
                </div>
            </a>

            <a href="modes/party/index.html" class="mode-btn mode-btn-party">
                <div class="mode-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                </div>
                <div class="mode-info">
                    <span class="mode-title">Party Mode</span>
                    <span class="mode-desc">Party games and challenges</span>
                </div>
            </a>
        </div>

        <div class="footer-text">Did you know Kampai is the Japanese word for "cumpie"?</div>

    </div>
</body>
</html>
