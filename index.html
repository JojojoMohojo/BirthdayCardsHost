<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>Kampai!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0d0a14;
            --amber: #f59e0b;
            --amber-glow: rgba(245, 158, 11, 0.35);
            --amber-dim: #92400e;
            --pink: #e879a0;
            --pink-glow: rgba(232, 121, 160, 0.35);
            --text: #f0e6d3;
            --text-muted: #7c6e8a;
        }

        html, body { height: 100%; }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(245, 158, 11, 0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 85%, rgba(232, 121, 160, 0.08) 0%, transparent 55%);
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 32px 20px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .home {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 360px;
        }

        .drink-icons {
            display: flex;
            gap: 18px;
            margin-bottom: 32px;
            font-size: 28px;
            filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.4));
        }

        .home-title {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            font-weight: 900;
            color: var(--amber);
            text-align: center;
            line-height: 1;
            letter-spacing: 1px;
            text-shadow: 0 0 40px rgba(245, 158, 11, 0.4);
        }

        .home-subtitle {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 12px;
            margin-bottom: 40px;
            text-align: center;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 24px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.2), transparent);
        }

        .divider-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.35);
        }

        .modes {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .mode-btn {
            width: 100%;
            padding: 16px 18px;
            border-radius: 14px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.12s, box-shadow 0.15s, filter 0.15s;
            border: 1px solid transparent;
        }

        .mode-btn:active { transform: scale(0.97); }

        .mode-btn-pub {
            background: linear-gradient(135deg, #c87d0c 0%, #f59e0b 60%, #fbbf24 100%);
            color: #1a0900;
            box-shadow: 0 4px 20px var(--amber-glow), 0 1px 0 rgba(255,255,255,0.1) inset;
        }

        .mode-btn-pub:hover {
            filter: brightness(1.08);
            box-shadow: 0 6px 28px var(--amber-glow);
        }

        .mode-btn-party {
            background: linear-gradient(135deg, #9b2355 0%, #e879a0 60%, #f0abcb 100%);
            color: #1a0010;
            box-shadow: 0 4px 20px var(--pink-glow), 0 1px 0 rgba(255,255,255,0.1) inset;
        }

        .mode-btn-party:hover {
            filter: brightness(1.08);
            box-shadow: 0 6px 28px var(--pink-glow);
        }

        .mode-icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.18);
            border-radius: 10px;
        }

        .mode-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3px;
        }

        .mode-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .mode-desc {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.6;
        }

        .footer-text {
            margin-top: 32px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.5;
        }

        .players-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            padding: 11px 16px;
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 12px;
            color: var(--text-muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            text-align: left;
        }
        .players-btn:hover { background: rgba(255,255,255,0.07); color: var(--text); border-color: rgba(245,158,11,0.35); }
        .players-btn-count {
            margin-left: auto;
            font-size: 12px;
            font-weight: 600;
            color: var(--amber);
            opacity: 0.8;
        }

        /* ── Player manager overlay ── */
        @keyframes plyrUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .plyr-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            display: flex; align-items: flex-end; justify-content: center;
            z-index: 100;
        }
        .plyr-drawer {
            background: #100c1a;
            border: 1px solid rgba(245,158,11,0.2);
            border-bottom: none;
            border-radius: 16px 16px 0 0;
            width: 100%; max-width: 480px; max-height: 75vh;
            display: flex; flex-direction: column;
            animation: plyrUp 0.25s cubic-bezier(0.34,1.2,0.64,1);
        }
        .plyr-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 20px 14px;
            border-bottom: 1px solid rgba(245,158,11,0.15);
            flex-shrink: 0;
        }
        .plyr-title { font-size: 18px; font-weight: 700; color: var(--amber); }
        .plyr-close {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            padding: 4px; display: flex; align-items: center; border-radius: 6px; transition: color 0.15s;
        }
        .plyr-close:hover { color: var(--amber); }
        .plyr-body { overflow-y: auto; padding: 14px 20px 24px; display: flex; flex-direction: column; gap: 6px; }
        .plyr-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(245,158,11,0.12);
            border-radius: 8px;
        }
        .plyr-name { flex: 1; font-size: 14px; font-weight: 500; color: var(--text); }
        .plyr-rename-input {
            flex: 1; padding: 3px 8px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(245,158,11,0.4);
            border-radius: 6px;
            color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; user-select: text;
        }
        .plyr-icon-btn {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            padding: 3px; display: flex; align-items: center; border-radius: 4px; transition: color 0.15s;
        }
        .plyr-icon-btn:hover { color: var(--amber); }
        .plyr-icon-btn--del:hover { color: #f87171; }
        .plyr-empty { font-size: 13px; color: var(--text-muted); padding: 4px 2px; }
        .plyr-add-row {
            display: flex; gap: 8px;
            margin-top: 8px; padding-top: 14px;
            border-top: 1px solid rgba(245,158,11,0.12);
        }
        .plyr-input {
            flex: 1; padding: 9px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(245,158,11,0.2);
            border-radius: 8px;
            color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; user-select: text;
        }
        .plyr-input::placeholder { color: var(--text-muted); }
        .plyr-input:focus { border-color: var(--amber); }
        .plyr-add-btn {
            padding: 9px 18px;
            background: var(--amber); border: none; border-radius: 8px;
            color: #1a0900; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: filter 0.15s; white-space: nowrap;
        }
        .plyr-add-btn:hover { filter: brightness(1.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="home">

        <div class="drink-icons">
            <span>🍺</span>
            <span>🥂</span>
            <span>🍹</span>
        </div>

        <div class="home-title">Kampai!</div>
        <div class="home-subtitle">Choose your game</div>

        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-dot"></div>
            <div class="divider-line"></div>
        </div>

        <div class="modes">
            <a href="modes/pub-crawl/index.html" class="mode-btn mode-btn-pub">
                <div class="mode-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 2h14l-2 18H7L5 2z"/>
                        <path d="M5 8h14"/>
                        <path d="M8 2l1 6M16 2l-1 6"/>
                    </svg>
                </div>
                <div class="mode-info">
                    <span class="mode-title">Pub Crawl Mode</span>
                    <span class="mode-desc">Draw cards, assign forfeits, track the crawl</span>
                </div>
            </a>

            <a href="modes/party/index.html" class="mode-btn mode-btn-party">
                <div class="mode-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                </div>
                <div class="mode-info">
                    <span class="mode-title">Party Mode</span>
                    <span class="mode-desc">Party games and challenges</span>
                </div>
            </a>
        </div>

        <button class="players-btn" id="players-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Players
            <span class="players-btn-count" id="players-count"></span>
        </button>

        <div class="footer-text">Did you know Kampai is the Japanese word for "cumpie"?</div>

    </div>

    <div id="plyr-overlay" class="plyr-overlay hidden">
        <div class="plyr-drawer">
            <div class="plyr-header">
                <span class="plyr-title">Players</span>
                <button class="plyr-close" id="plyr-close" aria-label="Close">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="plyr-body" id="plyr-body"></div>
        </div>
    </div>

    <script>
        const KAMPAI_PLAYERS_KEY = 'kampai_players';

        function plyrLoad() {
            try { return JSON.parse(localStorage.getItem(KAMPAI_PLAYERS_KEY)) || []; } catch (e) { return []; }
        }
        function plyrSave(list) {
            localStorage.setItem(KAMPAI_PLAYERS_KEY, JSON.stringify(list));
        }
        function plyrUpdateBtn() {
            const n = plyrLoad().length;
            document.getElementById('players-count').textContent = n ? n + (n === 1 ? ' player' : ' players') : '';
        }

        function plyrOpen() {
            plyrRender();
            document.getElementById('plyr-overlay').classList.remove('hidden');
        }
        function plyrClose() {
            document.getElementById('plyr-overlay').classList.add('hidden');
            plyrUpdateBtn();
        }

        function plyrRender() {
            const body = document.getElementById('plyr-body');
            body.innerHTML = '';
            const list = plyrLoad();

            if (list.length === 0) {
                const e = document.createElement('div');
                e.className = 'plyr-empty';
                e.textContent = 'No players yet — add some below.';
                body.appendChild(e);
            } else {
                list.forEach((name, i) => {
                    const el = document.createElement('div');
                    el.className = 'plyr-item';
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'plyr-name';
                    nameSpan.textContent = name;
                    const editBtn = document.createElement('button');
                    editBtn.className = 'plyr-icon-btn';
                    editBtn.setAttribute('aria-label', 'Rename');
                    editBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>';
                    editBtn.addEventListener('click', () => plyrStartRename(i, el, nameSpan));
                    const delBtn = document.createElement('button');
                    delBtn.className = 'plyr-icon-btn plyr-icon-btn--del';
                    delBtn.setAttribute('aria-label', 'Remove');
                    delBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
                    delBtn.addEventListener('click', () => { const l = plyrLoad(); l.splice(i, 1); plyrSave(l); plyrRender(); });
                    el.appendChild(nameSpan); el.appendChild(editBtn); el.appendChild(delBtn);
                    body.appendChild(el);
                });
            }

            const row = document.createElement('div');
            row.className = 'plyr-add-row';
            const input = document.createElement('input');
            input.type = 'text'; input.className = 'plyr-input'; input.placeholder = 'New player name…'; input.maxLength = 50;
            const addBtn = document.createElement('button');
            addBtn.className = 'plyr-add-btn'; addBtn.textContent = 'Add';
            addBtn.addEventListener('click', () => {
                const name = input.value.trim(); if (!name) return;
                const l = plyrLoad();
                if (!l.includes(name)) { l.push(name); plyrSave(l); }
                input.value = ''; plyrRender();
            });
            input.addEventListener('keydown', e => { if (e.key === 'Enter') addBtn.click(); });
            row.appendChild(input); row.appendChild(addBtn);
            body.appendChild(row);
        }

        function plyrStartRename(index, el, nameSpan) {
            const list = plyrLoad();
            const oldName = list[index];
            const input = document.createElement('input');
            input.type = 'text'; input.value = oldName; input.className = 'plyr-rename-input';
            el.replaceChild(input, nameSpan);
            input.focus(); input.select();
            let done = false;
            const commit = () => {
                if (done) return; done = true;
                const newName = input.value.trim();
                if (newName && newName !== oldName) { list[index] = newName; plyrSave(list); }
                plyrRender();
            };
            input.addEventListener('blur', commit);
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') input.blur();
                if (e.key === 'Escape') { done = true; plyrRender(); }
            });
        }

        document.getElementById('players-btn').addEventListener('click', plyrOpen);
        document.getElementById('plyr-close').addEventListener('click', plyrClose);
        document.getElementById('plyr-overlay').addEventListener('click', function(e) { if (e.target === this) plyrClose(); });

        plyrUpdateBtn();
    </script>
</body>
</html>
